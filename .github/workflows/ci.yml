name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs this change needs, to save Actions minutes (Cameron, 11-10).
  # Skipped jobs report success, so required checks still pass. If this job fails, everything runs.
  #   - A push to main that merged a PR runs nothing: the PR's run already checked it.
  #   - Markdown outside website/docs (the board, the log, internal notes) runs nothing.
  #   - website/docs runs docs; supabase runs edge and rls; anything else runs ci.
  #   - A change to this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.pick.outputs.ci }}
      edge: ${{ steps.pick.outputs.edge }}
      docs: ${{ steps.pick.outputs.docs }}
      rls: ${{ steps.pick.outputs.rls }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ci=false; edge=false; docs=false; rls=false
          all() { ci=true; edge=true; docs=true; rls=true; }
          if [ "$EVENT" = push ] && [ -n "$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/pulls" --jq '.[] | select(.merged_at != null) | .number')" ]; then
            echo "Merged from a PR that CI already checked; nothing to run."
          elif [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            all
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/workflows/*) all ;;
                website/docs/*) docs=true ;;
                supabase/*) edge=true; rls=true ;;
                *.md) ;;
                *) ci=true ;;
              esac
            done <<< "$files"
          fi
          printf 'ci=%s\nedge=%s\ndocs=%s\nrls=%s\n' $ci $edge $docs $rls | tee -a "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # react-router 8 needs Node 22.22 or later (A17).
          node-version: '22.22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisories in what ships to the browser fail the build; dev-only tools are left out (A23).
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # The runner is on UTC. Dates the app reads as local calendar days must hold east of UTC too,
      # so the date tests run once more where it is already tomorrow (UTC+13).
      - name: Date tests in another time zone
        env:
          TZ: Pacific/Auckland
        run: >-
          npx vitest run
          src/test/dateFns.test.ts
          src/utils/dateOnly src/utils/dateUtils src/utils/gigTimeframe src/utils/scheduleConflicts
          src/utils/csv src/utils/activityLog src/utils/gigAccountingSections
          src/services/activityLogEntries src/components/gig/print
          src/components/mobile/MobileInventoryMode src/components/gigs

      - name: Build
        env:
          # Placeholders — the client validates presence at runtime only; no
          # real project is contacted during a build
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          # A real DSN keeps ~72 KB of @sentry in the main chunk; a dummy one
          # makes CI measure the prod-shaped bundle
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
        run: npm run build

      - name: Check bundle size
        run: npm run check:bundle

  edge:
    # Type-checks the edge functions against their pinned dependencies (A7, A23). The lockfile is
    # frozen: a dependency that changed without an updated supabase/functions/deno.lock fails here.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.edge == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: deno check
        working-directory: supabase/functions
        env:
          # The functions run without the app's package.json; check them the same way.
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check --no-config --lock=deno.lock --frozen server/index.ts ai-scan/index.ts health-check/index.ts push/index.ts
      - name: Route and middleware tests
        working-directory: supabase/functions
        env:
          DENO_NO_PACKAGE_JSON: '1'
          DENO_TESTING: '1'
        run: deno test --no-config --lock=deno.lock --frozen --allow-env server/test/

  docs:
    # Builds the documentation site (website/docs) so a broken page fails the PR, not the deploy (A23).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/docs/.nvmrc
          cache: npm
          cache-dependency-path: website/docs/package-lock.json
      - name: Install
        working-directory: website/docs
        run: npm ci
      - name: Build
        working-directory: website/docs
        run: npm run build

  rls:
    # Applies every migration to a throwaway Postgres 17 and checks tenant
    # isolation (supabase/tests/rls/). See supabase/tests/rls/README.md.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rls == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: RLS tests
        run: supabase/tests/rls/run.sh
      - name: Data conversion tests
        run: supabase/tests/conversion/run.sh
